{% include base_path %}
<!-- start custom head snippets -->
<link rel="icon" href="{{ base_path }}/images/cap.ico" sizes="any">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#0b4f71">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css">
{% if page.math %}
<!-- MathJax only on pages with `math: true` in front matter -->
<script>window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']] } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{% endif %}
<!-- end custom head snippets -->
